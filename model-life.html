<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>受控粒子生命：深海结构涌现</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050508; touch-action: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 15px; left: 15px; pointer-events: none; color: #8899aa; font-size: 13px; line-height: 1.6; text-shadow: 1px 1px 2px #000; }
        .hud-btn { pointer-events: auto; background: rgba(30,40,50,0.7); color: #00ffcc; border: 1px solid #00ffcc55; padding: 10px 16px; margin-top: 10px; border-radius: 6px; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.2s; font-weight: bold; }
        .hud-btn:active { background: rgba(0, 255, 204, 0.3); }
    </style>
</head>
<body>
    <div id="ui">
        模型状态: 粘滞流体动力学 + 基因锁约束<br>
        交互: 触摸/滑动屏幕释放强斥力场<br>
        <button class="hud-btn" id="randomizeBtn">进行受控随机进化</button>
    </div>
    <canvas id="lifeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('lifeCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;

        // 优化后的物理引擎参数
        const numTypes = 4;        
        const numParticles = 900;  // 增加粒子密度以构建更坚固的组织
        const friction = 0.55;     // 关键优化：大幅增加流体阻尼(0.85 -> 0.55)，抑制剧烈抖动
        const rMax = 70;           // 相互作用最大半径
        const rMin = 18;           // 刚体碰撞半径（增大以产生更明显的细胞体积）
        const forceFactor = 0.25;  // 关键优化：降低整体作用力(0.5 -> 0.25)，运动更优雅
        
        let particles = [];
        let interactionMatrix = [];
        // 调整颜色映射，使其具有深海生物发光的质感
        const colors = ['#FF2255', '#00DDFF', '#55FF44', '#FFBB00'];

        let pointer = { x: -1000, y: -1000, active: false };

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function updatePointer(e) {
            pointer.active = true;
            if (e.touches && e.touches.length > 0) {
                pointer.x = e.touches[0].clientX; pointer.y = e.touches[0].clientY;
            } else {
                pointer.x = e.clientX; pointer.y = e.clientY;
            }
        }
        function releasePointer() { pointer.active = false; }
        
        canvas.addEventListener('mousedown', updatePointer);
        canvas.addEventListener('mousemove', (e) => { if (pointer.active) updatePointer(e); });
        canvas.addEventListener('mouseup', releasePointer);
        canvas.addEventListener('mouseleave', releasePointer);
        canvas.addEventListener('touchstart', updatePointer, {passive: false});
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); updatePointer(e); }, {passive: false});
        canvas.addEventListener('touchend', releasePointer);

        // 初始化物理环境
        function initSystem(usePreset = false) {
            if (usePreset) {
                // 预设“水母/游动细胞”基因组：
                // 红核(0)高度自吸；青膜(1)吸附红核但适度排斥；绿尾(2)追逐青膜；形成持续的拓扑推进结构
                interactionMatrix = [
                    [ 0.8, -0.1, -0.2,  0.0 ], 
                    [ 0.4,  0.7, -0.2, -0.1 ], 
                    [-0.1,  0.5,  0.7, -0.2 ], 
                    [ 0.0, -0.2,  0.4,  0.6 ]  
                ];
            } else {
                // 受控随机生成：不再是纯混沌
                interactionMatrix = [];
                for (let i = 0; i < numTypes; i++) {
                    let row = [];
                    for (let j = 0; j < numTypes; j++) {
                        if (i === j) {
                            // 基因锁约束 1：同类必须相吸（0.4 到 0.9），确保组织结构不崩溃
                            row.push(Math.random() * 0.5 + 0.4);
                        } else {
                            // 基因锁约束 2：异类作用力适当缩放，避免过度撕裂
                            row.push((Math.random() - 0.5) * 1.2);
                        }
                    }
                    interactionMatrix.push(row);
                }
            }

            // 初始化粒子群坐标与状态
            particles = [];
            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: 0, vy: 0,
                    type: Math.floor(Math.random() * numTypes)
                });
            }
        }

        // 引力/斥力连续势能函数
        function forceFunction(r, attrForce) {
            if (r < rMin) {
                return (r / rMin - 1); // 刚体强排斥（维持体积）
            } else if (r > rMin && r < rMax) {
                const numerator = Math.abs(2 * r - rMin - rMax);
                const denominator = rMax - rMin;
                return attrForce * (1 - numerator / denominator); // 平滑过渡受力区
            }
            return 0;
        }

        // 核心动力学求解
        function update() {
            for (let i = 0; i < numParticles; i++) {
                let p1 = particles[i];
                let fx = 0, fy = 0;

                for (let j = 0; j < numParticles; j++) {
                    if (i === j) continue;
                    let p2 = particles[j];

                    let dx = p2.x - p1.x;
                    let dy = p2.y - p1.y;
                    
                    // 环面折叠计算（无缝世界）
                    if (dx > width / 2) dx -= width;
                    else if (dx < -width / 2) dx += width;
                    if (dy > height / 2) dy -= height;
                    else if (dy < -height / 2) dy += height;

                    let r = Math.sqrt(dx * dx + dy * dy);

                    if (r > 0 && r < rMax) {
                        const matrixVal = interactionMatrix[p1.type][p2.type];
                        const f = forceFunction(r, matrixVal);
                        fx += (dx / r) * f;
                        fy += (dy / r) * f;
                    }
                }

                // 用户触摸引入高能斥力场
                if (pointer.active) {
                    let dxP = pointer.x - p1.x;
                    let dyP = pointer.y - p1.y;
                    let rP = Math.sqrt(dxP * dxP + dyP * dyP);
                    if (rP < 120 && rP > 0) {
                        let pForce = -4 * (1 - rP / 120); 
                        fx += (dxP / rP) * pForce;
                        fy += (dyP / rP) * pForce;
                    }
                }

                // 运动学更新：极化流体阻尼
                p1.vx = (p1.vx + fx * forceFactor) * friction;
                p1.vy = (p1.vy + fy * forceFactor) * friction;
            }

            // 更新坐标
            for (let i = 0; i < numParticles; i++) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;

                // 边界包裹
                if (p.x < 0) p.x += width;
                if (p.x > width) p.x -= width;
                if (p.y < 0) p.y += height;
