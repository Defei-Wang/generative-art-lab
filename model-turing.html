<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generative Art Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        /* 顶部自适应导航容器 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand {
            color: #00ffcc;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* 支持横向触控滑动的标签栏 */
        .nav-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 0;
            margin-left: 16px;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            padding: 6px 12px;
            font-size: 11px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }
        .nav-btn.active {
            color: #ff3366;
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.12);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        /* 渲染主视口 */
        #viewport {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">Art Lab</div>
        <nav class="nav-scroller" id="navContainer"></nav>
    </header>

    <iframe id="viewport" allow="accelerometer; camera; gyroscope; microphone"></iframe>

    <script>
        // ============================================================
        // 核心配置注册表：后续新增文件只需在此数组中增加一项，无需修改 HTML！
        // ============================================================
        const CONFIG_MODELS = [
            { id: 'life',     name: 'PARTICLE LIFE',  file: 'model-life.html' },
            { id: 'tree',     name: 'L-SYSTEM',       file: 'model-tree.html' },
            { id: 'turing',   name: 'TURING PATTERN', file: 'model-turing.html' },
            { id: 'clifford', name: 'CLIFFORD FLUID', file: 'model-clifford.html' }
            // 后续加入新实验，直接在下方追加，例如：
            // { id: 'fluid', name: 'NAVIER STOKES', file: 'model-fluid.html' },
        ];

        const navContainer = document.getElementById('navContainer');
        const viewport = document.getElementById('viewport');
        const buttonsMap = new Map();

        // 动态分发视口加载，强制携带时间戳摧毁缓存
        function switchModel(model, pushHash = true) {
            viewport.src = model.file + '?t=' + Date.now();

            buttonsMap.forEach((btn, id) => {
                btn.classList.toggle('active', id === model.id);
            });

            if (pushHash) {
                history.replaceState(null, '', '#' + model.id);
            }
        }

        // 自动构建导航界面
        function buildInterface() {
            navContainer.innerHTML = '';
            
            CONFIG_MODELS.forEach((model) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerText = model.name;
                btn.onclick = () => switchModel(model);
                
                navContainer.appendChild(btn);
                buttonsMap.set(model.id, btn);
            });

            // 支持 URL Hash 路由（例如通过域名访问 direct link: .../#turing）
            const hash = window.location.hash.replace('#', '');
            const target = CONFIG_MODELS.find(m => m.id === hash) || CONFIG_MODELS[0];
            switchModel(target, false);
        }

        buildInterface();
    </script>
</body>
</html>
