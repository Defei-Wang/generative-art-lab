<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图灵斑图 (Reaction-Diffusion) - 稳定性修复版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; touch-action: none; }
        canvas { display: block; image-rendering: pixelated; width: 100vw; height: 100vh; object-fit: cover; }
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-family: monospace; font-size: 13px; pointer-events: none; mix-blend-mode: difference; line-height: 1.5; }
        .highlight { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">TURING PATTERN // REACTION-DIFFUSION<br>系统状态：<span class="highlight">数值钳制已激活 (抗坍缩)</span><br>交互：随意拖拽涂抹，观察组织的撕裂与重生</div>
    <canvas id="rdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rdCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // 内部演化矩阵分辨率
        const width = 256;
        const height = 256;
        canvas.width = width;
        canvas.height = height;

        // Gray-Scott 参数：生成“游动珊瑚”或“豹纹”
        const Da = 1.0;     
        const Db = 0.5;     
        const f = 0.0545;   
        const k = 0.0620;   

        let grid = new Float32Array(width * height * 2);
        let next = new Float32Array(width * height * 2);
        let imageData = ctx.createImageData(width, height);

        // 初始化环境矩阵
        for (let i = 0; i < width * height; i++) {
            grid[i * 2] = 1.0; 
            grid[i * 2 + 1] = 0.0;
        }

        // 初始种子
        const cx = width / 2, cy = height / 2;
        for (let y = cy - 6; y < cy + 6; y++) {
            for (let x = cx - 6; x < cx + 6; x++) {
                grid[(y * width + x) * 2 + 1] = 1.0;
            }
        }

        let pointer = { x: -100, y: -100, down: false };

        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            // 将屏幕坐标映射到 256x256 的数组索引中
            pointer.x = Math.floor((clientX - rect.left) / rect.width * width);
            pointer.y = Math.floor((clientY - rect.top) / rect.height * height);
        }

        // 绑定全平台事件
        window.addEventListener('mousedown', (e) => { pointer.down = true; updatePointer(e); });
        window.addEventListener('mousemove', (e) => { if(pointer.down) updatePointer(e); });
        window.addEventListener('mouseup', () => pointer.down = false);
        window.addEventListener('mouseleave', () => pointer.down = false);
        
        window.addEventListener('touchstart', (e) => { pointer.down = true; updatePointer(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(pointer.down) updatePointer(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => pointer.down = false);

        function evolve() {
            // 【安全注入】将用户干预移出微观迭代循环，每帧只注入一次，防止梯度爆炸
            if (pointer.down && pointer.x > 4 && pointer.x < width - 4 && pointer.y > 4 && pointer.y < height - 4) {
                for(let dy = -4; dy <= 4; dy++) {
                    for(let dx = -4; dx <= 4; dx++) {
                        // 创造圆形笔触
                        if (dx*dx + dy*dy < 16) {
                            const idx = ((pointer.y + dy) * width + (pointer.x + dx)) * 2;
                            grid[idx] = 0.0;     // 抽干物质 A
                            grid[idx + 1] = 1.0; // 填满物质 B
                        }
                    }
                }
            }

            // 物理演算循环
            for (let step = 0; step < 8; step++) {
                for (let x = 1; x < width - 1; x++) {
                    for (let y = 1; y < height - 1; y++) {
                        const idx = (y * width + x) * 2;
                        const a = grid[idx];
                        const b = grid[idx + 1];

                        // 计算离散拉普拉斯 (空间扩散梯度)
                        let lapA = a * -1;
                        let lapB = b * -1;
                        lapA += (grid[idx - 2] + grid[idx + 2] + grid[idx - width * 2] + grid[idx + width * 2]) * 0.2;
                        lapB += (grid[idx - 1] + grid[idx + 3] + grid[idx - width * 2 + 1] + grid[idx + width * 2 + 1]) * 0.2;
                        lapA += (grid[idx - width * 2 - 2] + grid[idx - width * 2 + 2] + grid[idx + width * 2 - 2] + grid[idx + width * 2 + 2]) * 0.05;
                        lapB += (grid[idx - width * 2 - 1] + grid[idx - width * 2 + 3] + grid[idx + width * 2 - 1] + grid[idx + width * 2 + 3]) * 0.05;

                        const abb = a * b * b;

                        // 【核心修复：边界钳制】无论数字变得多疯狂，强制锁在 0.0 到 1.0 之间！
                        let nextA = a + (Da * lapA - abb + f * (1 - a));
                        let nextB = b + (Db * lapB + abb - (k + f) * b);
                        
                        next[idx] = Math.max(0, Math.min(1, nextA));
                        next[idx + 1] = Math.max(0, Math.min(1, nextB));
                    }
                }
                // 交换指针缓冲
                let temp = grid; grid = next; next = temp;
            }

            // 视觉渲染：映射出高端赛博朋克深海色调
            const pixels = imageData.data;
            for (let i = 0; i < width * height; i++) {
                const val = (grid[i * 2] - grid[i * 2 + 1]); // A - B 的浓度差 (-1 到 1)
                const p = i * 4;
                
                // 非线性色彩映射公式
                // val 越小 (物质 B 越多)，颜色越偏向荧光青绿；val 越大，越偏向幽暗深蓝
                pixels[p] = Math.max(0, 50 - val * 200);      // Red
                pixels[p + 1] = Math.max(20, 255 - Math.abs(val + 0.2) * 350); // Green (发光核心带)
                pixels[p + 2] = Math.max(50, 200 + val * 100); // Blue
                pixels[p + 3] = 255; // Alpha
            }
            
            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(evolve);
        }
        
        evolve();
    </script>
</body>
</html>
