<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图灵斑图 (Reaction-Diffusion) - 低色温琥珀金护眼版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: rgba(255, 255, 255, 0.7); 
            font-family: monospace; 
            font-size: 12px; 
            pointer-events: none; 
            text-shadow: 0 1px 3px #000;
            line-height: 1.6; 
        }
        .highlight { color: #ffb833; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        TURING PATTERN // AMBER BIOLUMINESCENCE<br>
        光谱：<span class="highlight">黑曜石底质 / 低能级暖金脊线</span><br>
        交互：轻触划动屏幕，观察化学原纤生长
    </div>
    <canvas id="rdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rdCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const Da = 1.0;     
        const Db = 0.5;     
        const f = 0.0545;   
        const k = 0.0620;   

        let simW = 0, simH = 0;
        let grid = null;
        let next = null;
        let imageData = null;

        function initSimulation() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const aspect = screenW / screenH;

            if (aspect >= 1.0) {
                simH = 260;
                simW = Math.round(260 * aspect);
            } else {
                simW = 260;
                simH = Math.round(260 / aspect);
            }

            canvas.width = simW;
            canvas.height = simH;

            const totalCells = simW * simH;
            grid = new Float32Array(totalCells * 2);
            next = new Float32Array(totalCells * 2);
            imageData = ctx.createImageData(simW, simH);

            for (let i = 0; i < totalCells; i++) {
                grid[i * 2] = 1.0;
                grid[i * 2 + 1] = 0.0;
            }

            // 中心初始种子
            const cx = Math.floor(simW / 2);
            const cy = Math.floor(simH / 2);
            const seedR = 8;
            for (let y = cy - seedR; y <= cy + seedR; y++) {
                for (let x = cx - seedR; x <= cx + seedR; x++) {
                    if ((x - cx) ** 2 + (y - cy) ** 2 <= seedR * seedR) {
                        grid[(y * simW + x) * 2 + 1] = 0.8;
                    }
                }
            }
        }

        initSimulation();
        window.addEventListener('resize', initSimulation);

        let pointer = { 
            x: -100, 
            y: -100, 
            prevX: -100, 
            prevY: -100, 
            down: false, 
            isFirst: true 
        };

        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            pointer.x = ((clientX - rect.left) / rect.width) * simW;
            pointer.y = ((clientY - rect.top) / rect.height) * simH;
        }

        function onPointerDown(e) {
            pointer.down = true;
            pointer.isFirst = true;
            updatePointer(e);
            pointer.prevX = pointer.x;
            pointer.prevY = pointer.y;
        }

        function onPointerMove(e) {
            if (pointer.down) updatePointer(e);
        }

        function onPointerUp() {
            pointer.down = false;
        }

        window.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        window.addEventListener('mouseleave', onPointerUp);

        window.addEventListener('touchstart', (e) => { 
            onPointerDown(e); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchmove', (e) => { 
            onPointerMove(e); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchend', onPointerUp);

        function injectAt(cx, cy) {
            const brushR = 2.8;
            const rCeil = Math.ceil(brushR);
            const minX = Math.max(1, Math.floor(cx - rCeil));
            const maxX = Math.min(simW - 2, Math.ceil(cx + rCeil));
            const minY = Math.max(1, Math.floor(cy - rCeil));
            const maxY = Math.min(simH - 2, Math.ceil(cy + rCeil));

            for (let py = minY; py <= maxY; py++) {
                for (let px = minX; px <= maxX; px++) {
                    const distSq = (cx - px) * (cx - px) + (cy - py) * (cy - py);
                    if (distSq <= brushR * brushR) {
                        const falloff = 1.0 - Math.sqrt(distSq) / brushR;
                        const idx = (py * simW + px) * 2;
                        grid[idx] = Math.max(0.1, grid[idx] - falloff * 0.28);
                        grid[idx + 1] = Math.min(0.85, grid[idx + 1] + falloff * 0.38);
                    }
                }
            }
        }

        function evolve() {
            if (pointer.down) {
                if (pointer.isFirst) {
                    injectAt(pointer.x, pointer.y);
                    pointer.isFirst = false;
                } else {
                    const dx = pointer.x - pointer.prevX;
                    const dy = pointer.y - pointer.prevY;
                    const dist = Math.hypot(dx, dy);
                    const steps = Math.max(1, Math.ceil(dist / 1.2));
                    
                    for (let s = 1; s <= steps; s++) {
                        const t = s / steps;
                        injectAt(pointer.prevX + dx * t, pointer.prevY + dy * t);
                    }
                }
                pointer.prevX = pointer.x;
                pointer.prevY = pointer.y;
            }

            const w2 = simW * 2;
            for (let step = 0; step < 7; step++) {
                for (let y = 1; y < simH - 1; y++) {
                    const row = y * w2;
                    const rowUp = row - w2;
                    const rowDown = row + w2;

                    for (let x = 1; x < simW - 1; x++) {
                        const idx = row + (x * 2);
                        const a = grid[idx];
                        const b = grid[idx + 1];

                        let lapA = a * -1.0;
                        let lapB = b * -1.0;

                        lapA += (grid[idx - 2] + grid[idx + 2] + grid[rowUp + x * 2] + grid[rowDown + x * 2]) * 0.2;
                        lapB += (grid[idx - 1] + grid[idx + 3] + grid[rowUp + x * 2 + 1] + grid[rowDown + x * 2 + 1]) * 0.2;

                        lapA += (grid[rowUp + (x - 1) * 2] + grid[rowUp + (x + 1) * 2] + 
                                 grid[rowDown + (x - 1) * 2] + grid[rowDown + (x + 1) * 2]) * 0.05;
                        lapB += (grid[rowUp + (x - 1) * 2 + 1] + grid[rowUp + (x + 1) * 2 + 1] + 
                                 grid[rowDown + (x - 1) * 2 + 1] + grid[rowDown + (x + 1) * 2 + 1]) * 0.05;

                        const abb = a * b * b;

                        next[idx] = Math.max(0.0, Math.min(1.0, a + (Da * lapA - abb + f * (1.0 - a))));
                        next[idx + 1] = Math.max(0.0, Math.min(1.0, b + (Db * lapB + abb - (k + f) * b)));
                    }
                }

                // 诺伊曼边界零通量同步
                for (let y = 0; y < simH; y++) {
                    const r = y * w2;
                    next[r] = next[r + 2];
                    next[r + 1] = next[r + 3];
                    next[r + (simW - 1) * 2] = next[r + (simW - 2) * 2];
                    next[r + (simW - 1) * 2 + 1] = next[r + (simW - 2) * 2 + 1];
                }
                for (let x = 0; x < simW; x++) {
                    const top = x * 2;
                    const btm = (simH - 1) * w2 + x * 2;
                    next[top] = next[w2 + top];
                    next[top + 1] = next[w2 + top + 1];
                    next[btm] = next[btm - w2];
                    next[btm + 1] = next[btm - w2 + 1];
                }

                const temp = grid; grid = next; next = temp;
            }

            // 核心修复：低能级暖色调光谱传递函数
            const pixels = imageData.data;
            const len = simW * simH;
            for (let i = 0; i < len; i++) {
                const val = grid[i * 2] - grid[i * 2 + 1];
                // 提取反应活性脊线强度因子 u：背景区域归零，反应活跃核心趋向 1.0
                const u = Math.max(0.0, Math.min(1.0, (0.85 - val) * 1.35));
                const p = i * 4;

                // 背景为深邃黑曜石，脊线为琥珀暖金 (R > G >> B)，彻底消除短波蓝光
                pixels[p]     = 10 + u * 242;                                    // Red 暖色主导
                pixels[p + 1] = 12 + Math.pow(u, 1.4) * 180;                     // Green 柔和微量
                pixels[p + 2] = 16 + Math.max(0.0, Math.sin(u * Math.PI) * 25);  // Blue 极小化抑制
                pixels[p + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(evolve);
        }

        evolve();
    </script>
</body>
</html>
