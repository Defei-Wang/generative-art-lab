<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图灵斑图 (Reaction-Diffusion) - 黏菌仿生版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #080a08; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: rgba(210, 195, 140, 0.7); 
            font-family: monospace; 
            font-size: 12px; 
            pointer-events: none; 
            text-shadow: 0 1px 3px #000;
            line-height: 1.6; 
        }
        .highlight { color: #d4a72c; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        TURING PATTERN // PHYSARUM SLIME ENGINE<br>
        光谱：<span class="highlight">黏菌原纤维 (低饱和芥末黄)</span><br>
        轨迹：<span class="highlight">二阶贝塞尔样条平滑 (消除折线感)</span>
    </div>
    <canvas id="rdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rdCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const Da = 1.0;     
        const Db = 0.5;     
        const f = 0.0545;   
        const k = 0.0620;   

        let simW = 0, simH = 0;
        let grid = null;
        let next = null;
        let imageData = null;

        function initSimulation() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const aspect = screenW / screenH;

            if (aspect >= 1.0) {
                simH = 260;
                simW = Math.round(260 * aspect);
            } else {
                simW = 260;
                simH = Math.round(260 / aspect);
            }

            canvas.width = simW;
            canvas.height = simH;

            const totalCells = simW * simH;
            grid = new Float32Array(totalCells * 2);
            next = new Float32Array(totalCells * 2);
            imageData = ctx.createImageData(simW, simH);

            for (let i = 0; i < totalCells; i++) {
                grid[i * 2] = 1.0;
                grid[i * 2 + 1] = 0.0;
            }

            // 中心初始种子
            const cx = Math.floor(simW / 2);
            const cy = Math.floor(simH / 2);
            const seedR = 8;
            for (let y = cy - seedR; y <= cy + seedR; y++) {
                for (let x = cx - seedR; x <= cx + seedR; x++) {
                    if ((x - cx) ** 2 + (y - cy) ** 2 <= seedR * seedR) {
                        grid[(y * simW + x) * 2 + 1] = 0.8;
                    }
                }
            }
        }

        initSimulation();
        window.addEventListener('resize', initSimulation);

        // 触控与样条插值缓冲队列
        let isDown = false;
        let strokeQueue = [];

        function getSimCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: ((clientX - rect.left) / rect.width) * simW,
                y: ((clientY - rect.top) / rect.height) * simH
            };
        }

        function onStart(x, y) {
            isDown = true;
            strokeQueue = [getSimCoords(x, y)];
            injectAt(strokeQueue[0].x, strokeQueue[0].y);
        }

        function onMove(x, y) {
            if (!isDown) return;
            strokeQueue.push(getSimCoords(x, y));
        }

        function onEnd() {
            isDown = false;
            strokeQueue = [];
        }

        window.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('mouseleave', onEnd);

        window.addEventListener('touchstart', e => { 
            onStart(e.touches[0].clientX, e.touches[0].clientY); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchmove', e => { 
            onMove(e.touches[0].clientX, e.touches[0].clientY); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchend', onEnd);

        function injectAt(cx, cy) {
            const brushR = 2.6;
            const rCeil = Math.ceil(brushR);
            const minX = Math.max(1, Math.floor(cx - rCeil));
            const maxX = Math.min(simW - 2, Math.ceil(cx + rCeil));
            const minY = Math.max(1, Math.floor(cy - rCeil));
            const maxY = Math.min(simH - 2, Math.ceil(cy + rCeil));

            for (let py = minY; py <= maxY; py++) {
                for (let px = minX; px <= maxX; px++) {
                    const distSq = (cx - px) * (cx - px) + (cy - py) * (cy - py);
                    if (distSq <= brushR * brushR) {
                        const falloff = 1.0 - Math.sqrt(distSq) / brushR;
                        const idx = (py * simW + px) * 2;
                        grid[idx] = Math.max(0.12, grid[idx] - falloff * 0.25);
                        grid[idx + 1] = Math.min(0.82, grid[idx + 1] + falloff * 0.35);
                    }
                }
            }
        }

        function processStrokeQueue() {
            if (strokeQueue.length < 2) return;

            // 当积累点数达到 3 个时，执行二次贝塞尔样条平滑插值
            while (strokeQueue.length >= 3) {
                const p0 = strokeQueue[0];
                const p1 = strokeQueue[1];
                const p2 = strokeQueue[2];

                const m0x = (p0.x + p1.x) * 0.5;
                const m0y = (p0.y + p1.y) * 0.5;
                const m1x = (p1.x + p2.x) * 0.5;
                const m1y = (p1.y + p2.y) * 0.5;

                const chord = Math.hypot(m1x - m0x, m1y - m0y);
                const steps = Math.max(1, Math.ceil(chord / 1.0));

                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    const it = 1.0 - t;
                    // 二次贝塞尔曲线方程
                    const qx = it * it * m0x + 2 * it * t * p1.x + t * t * m1x;
                    const qy = it * it * m0y + 2 * it * t * p1.y + t * t * m1y;
                    injectAt(qx, qy);
                }

                strokeQueue.shift();
            }

            // 处理队列末尾的遗留段
            if (strokeQueue.length === 2 && !isDown) {
                const p0 = strokeQueue[0];
                const p1 = strokeQueue[1];
                const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
                const steps = Math.max(1, Math.ceil(dist / 1.0));
                for (let i = 1; i <= steps; i++) {
                    const t = i / steps;
                    injectAt(p0.x + (p1.x - p0.x) * t, p0.y + (p1.y - p0.y) * t);
                }
                strokeQueue.shift();
            }
        }

        function evolve() {
            processStrokeQueue();

            const w2 = simW * 2;
            for (let step = 0; step < 7; step++) {
                for (let y = 1; y < simH - 1; y++) {
                    const row = y * w2;
                    const rowUp = row - w2;
                    const rowDown = row + w2;

                    for (let x = 1; x < simW - 1; x++) {
                        const idx = row + (x * 2);
                        const a = grid[idx];
                        const b = grid[idx + 1];

                        let lapA = a * -1.0;
                        let lapB = b * -1.0;

                        lapA += (grid[idx - 2] + grid[idx + 2] + grid[rowUp + x * 2] + grid[rowDown + x * 2]) * 0.2;
                        lapB += (grid[idx - 1] + grid[idx + 3] + grid[rowUp + x * 2 + 1] + grid[rowDown + x * 2 + 1]) * 0.2;

                        lapA += (grid[rowUp + (x - 1) * 2] + grid[rowUp + (x + 1) * 2] + 
                                 grid[rowDown + (x - 1) * 2] + grid[rowDown + (x + 1) * 2]) * 0.05;
                        lapB += (grid[rowUp + (x - 1) * 2 + 1] + grid[rowUp + (x + 1) * 2 + 1] + 
                                 grid[rowDown + (x - 1) * 2 + 1] + grid[rowDown + (x + 1) * 2 + 1]) * 0.05;

                        const abb = a * b * b;

                        next[idx] = Math.max(0.0, Math.min(1.0, a + (Da * lapA - abb + f * (1.0 - a))));
                        next[idx + 1] = Math.max(0.0, Math.min(1.0, b + (Db * lapB + abb - (k + f) * b)));
                    }
                }

                // 诺伊曼边界零通量同步
                for (let y = 0; y < simH; y++) {
                    const r = y * w2;
                    next[r] = next[r + 2];
                    next[r + 1] = next[r + 3];
                    next[r + (simW - 1) * 2] = next[r + (simW - 2) * 2];
                    next[r + (simW - 1) * 2 + 1] = next[r + (simW - 2) * 2 + 1];
                }
                for (let x = 0; x < simW; x++) {
                    const top = x * 2;
                    const btm = (simH - 1) * w2 + x * 2;
                    next[top] = next[w2 + top];
                    next[top + 1] = next[w2 + top + 1];
                    next[btm] = next[btm - w2];
                    next[btm + 1] = next[btm - w2 + 1];
                }

                const temp = grid; grid = next; next = temp;
            }

            // 黏菌光谱传递函数：芥末赭黄与暗橄榄微调
            const pixels = imageData.data;
            const len = simW * simH;
            for (let i = 0; i < len; i++) {
                const val = grid[i * 2] - grid[i * 2 + 1];
                // 活性标量 u 范围锁在 0.0 到 1.0
                const u = Math.max(0.0, Math.min(1.0, (0.82 - val) * 1.4));
                const p = i * 4;

                // 抑制极端亮度：R 最高约 200，G 最高约 170，B 保持微弱暗土色
                pixels[p]     = 8 + u * 192;                        // 柔和赭黄
                pixels[p + 1] = 10 + Math.pow(u, 1.15) * 162;       // 黏菌草本绿调
                pixels[p + 2] = 8 + u * 28;                         // 极低蓝光
                pixels[p + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(evolve);
        }

        evolve();
    </script>
</body>
</html>
