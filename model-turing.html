<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图灵斑图 (Reaction-Diffusion) - 完美拉普拉斯修复版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            touch-action: none; 
        }
        /* 保持画布绝对 1:1，杜绝几何畸变 */
        canvas { 
            display: block; 
            image-rendering: pixelated; 
            width: min(100vw, 100vh); 
            height: min(100vw, 100vh); 
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            font-family: monospace; 
            font-size: 13px; 
            pointer-events: none; 
            mix-blend-mode: difference; 
            line-height: 1.5; 
        }
        .highlight { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">TURING PATTERN // REACTION-DIFFUSION<br>系统状态：<span class="highlight">对称算子校准 / 零漂移</span><br>交互：拖拽涂抹，观察自组织迷宫</div>
    <canvas id="rdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rdCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        
        // 分辨率，数值越高细节越精细，但算力要求更大
        const width = 256;
        const height = 256;
        canvas.width = width;
        canvas.height = height;

        // Gray-Scott "迷宫/珊瑚" 基因参数
        const Da = 1.0;     
        const Db = 0.5;     
        const f = 0.0545;   
        const k = 0.0620;   

        // 将 A 和 B 的浓度分离到两个数组，避免交错索引导致的数学混乱
        let gridA = new Float32Array(width * height);
        let gridB = new Float32Array(width * height);
        let nextA = new Float32Array(width * height);
        let nextB = new Float32Array(width * height);
        let imageData = ctx.createImageData(width, height);

        // 初始化：充满 A，没有 B
        gridA.fill(1.0);
        gridB.fill(0.0);

        // 中心播撒 B 的种子（正圆形）
        const cx = Math.floor(width / 2);
        const cy = Math.floor(height / 2);
        for (let y = cy - 10; y <= cy + 10; y++) {
            for (let x = cx - 10; x <= cx + 10; x++) {
                if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= 100) {
                    gridB[y * width + x] = 1.0;
                }
            }
        }

        let pointer = { x: -100, y: -100, down: false };

        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            // 严格映射画布坐标
            pointer.x = Math.floor(((clientX - rect.left) / rect.width) * width);
            pointer.y = Math.floor(((clientY - rect.top) / rect.height) * height);
        }

        window.addEventListener('mousedown', (e) => { pointer.down = true; updatePointer(e); });
        window.addEventListener('mousemove', (e) => { if(pointer.down) updatePointer(e); });
        window.addEventListener('mouseup', () => pointer.down = false);
        window.addEventListener('mouseleave', () => pointer.down = false);
        window.addEventListener('touchstart', (e) => { pointer.down = true; updatePointer(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchmove', (e) => { if(pointer.down) updatePointer(e); e.preventDefault(); }, {passive: false});
        window.addEventListener('touchend', () => pointer.down = false);

        // 核心：严格对称的拉普拉斯卷积函数
        function laplaceA(x, y) {
            let sum = 0;
            const i = y * width + x;
            sum += gridA[i] * -1.0;
            sum += gridA[i - 1] * 0.2;
            sum += gridA[i + 1] * 0.2;
            sum += gridA[i - width] * 0.2;
            sum += gridA[i + width] * 0.2;
            sum += gridA[i - width - 1] * 0.05;
            sum += gridA[i - width + 1] * 0.05;
            sum += gridA[i + width - 1] * 0.05;
            sum += gridA[i + width + 1] * 0.05;
            return sum;
        }

        function laplaceB(x, y) {
            let sum = 0;
            const i = y * width + x;
            sum += gridB[i] * -1.0;
            sum += gridB[i - 1] * 0.2;
            sum += gridB[i + 1] * 0.2;
            sum += gridB[i - width] * 0.2;
            sum += gridB[i + width] * 0.2;
            sum += gridB[i - width - 1] * 0.05;
            sum += gridB[i - width + 1] * 0.05;
            sum += gridB[i + width - 1] * 0.05;
            sum += gridB[i + width + 1] * 0.05;
            return sum;
        }

        function evolve() {
            // 用户强力互动：暴力注入化学物质 B，抽干 A
            if (pointer.down && pointer.x > 5 && pointer.x < width - 5 && pointer.y > 5 && pointer.y < height - 5) {
                for(let dy = -5; dy <= 5; dy++) {
                    for(let dx = -5; dx <= 5; dx++) {
                        if (dx*dx + dy*dy <= 25) {
                            const idx = (pointer.y + dy) * width + (pointer.x + dx);
                            gridA[idx] = 0.0;
                            gridB[idx] = 1.0;
                        }
                    }
                }
            }

            // 加速演化：每帧内部迭代计算 10 次
            for (let step = 0; step < 10; step++) {
                // 注意：从 1 到 width-1，避开边缘防止数组越界报错
                for (let x = 1; x < width - 1; x++) {
                    for (let y = 1; y < height - 1; y++) {
                        const i = y * width + x;
                        const a = gridA[i];
                        const b = gridB[i];

                        const abb = a * b * b;
                        // 完美的 Gray-Scott 数学公式
                        const newA = a + (Da * laplaceA(x, y) - abb + f * (1 - a));
                        const newB = b + (Db * laplaceB(x, y) + abb - (k + f) * b);
                        
                        // 数值钳制（基因锁）：防止溢出变黑
                        nextA[i] = Math.max(0, Math.min(1, newA));
                        nextB[i] = Math.max(0, Math.min(1, newB));
                    }
                }
                
                // 交换缓冲指针（比复制数组快无数倍）
                let tempA = gridA; gridA = nextA; nextA = tempA;
                let tempB = gridB; gridB = nextB; nextB = tempB;
            }

            // 赛博朋克深海视觉渲染
            const pixels = imageData.data;
            for (let i = 0; i < width * height; i++) {
                const val = (gridA[i] - gridB[i]); // A 与 B 的浓度差
                const p = i * 4;
                
                pixels[p] = Math.max(0, 50 - val * 200);                        // R
                pixels[p + 1] = Math.max(20, 255 - Math.abs(val + 0.2) * 350);  // G
                pixels[p + 2] = Math.max(50, 200 + val * 100);                  // B
                pixels[p + 3] = 255;                                            // Alpha
            }
            
            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(evolve);
        }
        
        evolve();
    </script>
</body>
</html>
