<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>图灵斑图 (Reaction-Diffusion) - 零边界噪声版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        #ui { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #fff; 
            font-family: monospace; 
            font-size: 12px; 
            pointer-events: none; 
            mix-blend-mode: difference; 
            line-height: 1.6; 
        }
        .highlight { color: #00ffcc; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        TURING PATTERN // NEUMANN BOUNDARY<br>
        状态：<span class="highlight">零通量边界约束 / 微量软渗透</span><br>
        交互：轻触屏幕划动，观察微观有机原纤平滑分裂
    </div>
    <canvas id="rdCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rdCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        const Da = 1.0;     
        const Db = 0.5;     
        const f = 0.0545;   
        const k = 0.0620;   

        let simW = 0, simH = 0;
        let grid = null;
        let next = null;
        let imageData = null;

        function initSimulation() {
            const screenW = window.innerWidth;
            const screenH = window.innerHeight;
            const aspect = screenW / screenH;

            if (aspect >= 1.0) {
                simH = 260;
                simW = Math.round(260 * aspect);
            } else {
                simW = 260;
                simH = Math.round(260 / aspect);
            }

            canvas.width = simW;
            canvas.height = simH;

            const totalCells = simW * simH;
            grid = new Float32Array(totalCells * 2);
            next = new Float32Array(totalCells * 2);
            imageData = ctx.createImageData(simW, simH);

            for (let i = 0; i < totalCells; i++) {
                grid[i * 2] = 1.0;
                grid[i * 2 + 1] = 0.0;
            }

            // 初始化中心种子
            const cx = Math.floor(simW / 2);
            const cy = Math.floor(simH / 2);
            const seedR = 8;
            for (let y = cy - seedR; y <= cy + seedR; y++) {
                for (let x = cx - seedR; x <= cx + seedR; x++) {
                    if ((x - cx) ** 2 + (y - cy) ** 2 <= seedR * seedR) {
                        grid[(y * simW + x) * 2 + 1] = 0.8;
                    }
                }
            }
        }

        initSimulation();
        window.addEventListener('resize', initSimulation);

        let pointer = { x: -100, y: -100, down: false };

        function updatePointer(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            pointer.x = Math.floor(((clientX - rect.left) / rect.width) * simW);
            pointer.y = Math.floor(((clientY - rect.top) / rect.height) * simH);
        }

        window.addEventListener('mousedown', (e) => { pointer.down = true; updatePointer(e); });
        window.addEventListener('mousemove', (e) => { if (pointer.down) updatePointer(e); });
        window.addEventListener('mouseup', () => pointer.down = false);
        window.addEventListener('mouseleave', () => pointer.down = false);

        window.addEventListener('touchstart', (e) => { 
            pointer.down = true; 
            updatePointer(e); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchmove', (e) => { 
            if (pointer.down) updatePointer(e); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchend', () => pointer.down = false);

        function evolve() {
            // 物理真实感触碰：微量高斯软注入
            if (pointer.down && pointer.x > 3 && pointer.x < simW - 3 && pointer.y > 3 && pointer.y < simH - 3) {
                const brushR = 3; 
                for (let dy = -brushR; dy <= brushR; dy++) {
                    for (let dx = -brushR; dx <= brushR; dx++) {
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist <= brushR) {
                            const falloff = 1.0 - dist / brushR;
                            const idx = ((pointer.y + dy) * simW + (pointer.x + dx)) * 2;
                            // 温和渗透，保留底质 A 的存在，不触发极值过曝
                            grid[idx] = Math.max(0.1, grid[idx] - falloff * 0.35);
                            grid[idx + 1] = Math.min(0.85, grid[idx + 1] + falloff * 0.45);
                        }
                    }
                }
            }

            const w2 = simW * 2;
            for (let step = 0; step < 7; step++) {
                // 内部网格拉普拉斯卷积
                for (let y = 1; y < simH - 1; y++) {
                    const row = y * w2;
                    const rowUp = row - w2;
                    const rowDown = row + w2;

                    for (let x = 1; x < simW - 1; x++) {
                        const idx = row + (x * 2);
                        const a = grid[idx];
                        const b = grid[idx + 1];

                        let lapA = a * -1.0;
                        let lapB = b * -1.0;

                        lapA += (grid[idx - 2] + grid[idx + 2] + grid[rowUp + x * 2] + grid[rowDown + x * 2]) * 0.2;
                        lapB += (grid[idx - 1] + grid[idx + 3] + grid[rowUp + x * 2 + 1] + grid[rowDown + x * 2 + 1]) * 0.2;

                        lapA += (grid[rowUp + (x - 1) * 2] + grid[rowUp + (x + 1) * 2] + 
                                 grid[rowDown + (x - 1) * 2] + grid[rowDown + (x + 1) * 2]) * 0.05;
                        lapB += (grid[rowUp + (x - 1) * 2 + 1] + grid[rowUp + (x + 1) * 2 + 1] + 
                                 grid[rowDown + (x - 1) * 2 + 1] + grid[rowDown + (x + 1) * 2 + 1]) * 0.05;

                        const abb = a * b * b;

                        next[idx] = Math.max(0.0, Math.min(1.0, a + (Da * lapA - abb + f * (1.0 - a))));
                        next[idx + 1] = Math.max(0.0, Math.min(1.0, b + (Db * lapB + abb - (k + f) * b)));
                    }
                }

                // 核心修复：诺伊曼边界零通量同步，彻底消灭未定义缓冲造成的绿光闪烁
                for (let y = 0; y < simH; y++) {
                    const r = y * w2;
                    // 左边缘同步第 1 列
                    next[r] = next[r + 2];
                    next[r + 1] = next[r + 3];
                    // 右边缘同步倒数第 2 列
                    next[r + (simW - 1) * 2] = next[r + (simW - 2) * 2];
                    next[r + (simW - 1) * 2 + 1] = next[r + (simW - 2) * 2 + 1];
                }
                for (let x = 0; x < simW; x++) {
                    const top = x * 2;
                    const btm = (simH - 1) * w2 + x * 2;
                    // 上边缘同步第 1 行
                    next[top] = next[w2 + top];
                    next[top + 1] = next[w2 + top + 1];
                    // 下边缘同步倒数第 2 行
                    next[btm] = next[btm - w2];
                    next[btm + 1] = next[btm - w2 + 1];
                }

                const temp = grid; grid = next; next = temp;
            }

            // 色彩映射渲染
            const pixels = imageData.data;
            const len = simW * simH;
            for (let i = 0; i < len; i++) {
                const val = grid[i * 2] - grid[i * 2 + 1];
                const p = i * 4;

                pixels[p] = Math.max(0, 45 - val * 180);
                pixels[p + 1] = Math.max(15, 240 - Math.abs(val + 0.15) * 320);
                pixels[p + 2] = Math.max(45, 190 + val * 100);
                pixels[p + 3] = 255;
            }

            ctx.putImageData(imageData, 0, 0);
            requestAnimationFrame(evolve);
        }

        evolve();
    </script>
</body>
</html>
