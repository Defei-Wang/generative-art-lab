<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generative Art Lab</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 52px;
            background: rgba(10, 10, 14, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        .brand {
            color: #00ffcc;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .nav-scroller {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding: 4px 0;
            margin-left: 16px;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #888;
            padding: 6px 12px;
            font-size: 11px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }
        .nav-btn:hover {
            color: #fff;
            border-color: rgba(255, 255, 255, 0.4);
        }
        .nav-btn.active {
            color: #ff3366;
            border-color: #ff3366;
            background: rgba(255, 51, 102, 0.12);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            background: #000;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">Art Lab</div>
        <nav class="nav-scroller" id="navContainer"></nav>
    </header>

    <iframe id="viewport" allow="accelerometer; camera; gyroscope; microphone"></iframe>

    <script>
        // 配置仓库所属主体与仓库名称
        const GITHUB_OWNER = 'defei-wang';
        const GITHUB_REPO = 'generative-art-lab';

        // 知名模型的友好名称映射表（未匹配的文件名将自动转大写作为按钮名）
        const NAME_MAPPING = {
            'life': 'PARTICLE LIFE',
            'tree': 'L-SYSTEM',
            'turing': 'TURING PATTERN',
            'clifford': 'CLIFFORD FLUID',
            'physarum': 'PHYSARUM SLIME'
        };

        // 本地保底列表（在 API 限流或无网络时启用）
        const FALLBACK_MODELS = [
            { id: 'life',     name: 'PARTICLE LIFE',   file: 'model-life.html' },
            { id: 'tree',     name: 'L-SYSTEM',        file: 'model-tree.html' },
            { id: 'turing',   name: 'TURING PATTERN',  file: 'model-turing.html' },
            { id: 'clifford', name: 'CLIFFORD FLUID',  file: 'model-clifford.html' },
            { id: 'physarum', name: 'PHYSARUM SLIME',  file: 'model-physarum.html' }
        ];

        const navContainer = document.getElementById('navContainer');
        const viewport = document.getElementById('viewport');
        const buttonsMap = new Map();
        let loadedModels = [];

        function switchModel(model, pushHash = true) {
            // 追加时间戳穿透缓存
            viewport.src = model.file + '?t=' + Date.now();

            buttonsMap.forEach((btn, id) => {
                btn.classList.toggle('active', id === model.id);
            });

            if (pushHash) {
                history.replaceState(null, '', '#' + model.id);
            }
        }

        function renderNav(models) {
            loadedModels = models;
            navContainer.innerHTML = '';
            buttonsMap.clear();

            models.forEach((model) => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.innerText = model.name;
                btn.onclick = () => switchModel(model);
                navContainer.appendChild(btn);
                buttonsMap.set(model.id, btn);
            });

            const hash = window.location.hash.replace('#', '');
            const target = models.find(m => m.id === hash) || models[0];
            if (target) switchModel(target, false);
        }

        async function fetchRepoModels() {
            const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents`;
            const cacheKey = 'gal_models_cache';
            const cacheTimeKey = 'gal_models_cache_time';
            const now = Date.now();

            // 优先读取 10 分钟内的本地存储缓存，避免快速消耗 API 额度
            const cachedTime = localStorage.getItem(cacheTimeKey);
            const cachedData = localStorage.getItem(cacheKey);
            if (cachedTime && cachedData && now - Number(cachedTime) < 600000) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        renderNav(parsed);
                        return;
                    }
                } catch (e) {}
            }

            try {
                const response = await fetch(apiUrl, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!response.ok) {
                    throw new Error(`GitHub API Status: ${response.status}`);
                }

                const contents = await response.json();
                
                // 筛选所有 model-*.html 文件
                const dynamicModels = contents
                    .filter(item => item.type === 'file' && /^model-.*\.html$/.test(item.name))
                    .map(item => {
                        const rawId = item.name.replace(/^model-/, '').replace(/\.html$/, '');
                        return {
                            id: rawId,
                            name: NAME_MAPPING[rawId] || rawId.replace(/[-_]/g, ' ').toUpperCase(),
                            file: item.name
                        };
                    });

                if (dynamicModels.length > 0) {
                    localStorage.setItem(cacheKey, JSON.stringify(dynamicModels));
                    localStorage.setItem(cacheTimeKey, String(now));
                    renderNav(dynamicModels);
                    return;
                }
            } catch (err) {
                console.warn('API 动态发现受限，回退至本地配置:', err.message);
            }

            // API 失败或限流时启用保底
            renderNav(FALLBACK_MODELS);
        }

        fetchRepoModels();
    </script>
</body>
</html>
