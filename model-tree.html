<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 极致锐度与视口校准版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        /* 避开手机底部手势条与虚拟按键 */
        #info { 
            position: absolute; 
            bottom: 75px; 
            left: 15px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 11px; 
            line-height: 1.7;
            text-shadow: 0 1px 4px #000;
            z-index: 10;
        }
        .hud-panel {
            position: absolute;
            bottom: 75px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        button {
            background: rgba(15, 15, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #eee;
            padding: 7px 10px;
            font-size: 10px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        button:active { background: rgba(255, 255, 255, 0.2); }
        button.active {
            border-color: #00ffcc;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
        }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // VECTOR PRECISION ENGINE<br>
        模式: <span id="uiMode" style="color:#00ffcc">单指形态变异</span><br>
        ZOOM: <span id="uiZoom"></span> | LINES: <span id="uiDepth"></span>
    </div>
    <div class="hud-panel">
        <button id="lockBtn" onclick="toggleLock()">[ 锁定形态 ]</button>
        <button onclick="resetCamera()">[ 归位 ]</button>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiZoom = document.getElementById('uiZoom');
        const uiDepth = document.getElementById('uiDepth');
        const uiMode = document.getElementById('uiMode');
        const lockBtn = document.getElementById('lockBtn');
        
        let width = 0, height = 0;
        let dpr = 1;

        // 形态参数
        let targetAngle = 0.45; 
        let targetScale = 0.65; 
        let curAngle = targetAngle;
        let curScale = targetScale;
        let normX = 0.3, normY = 0.5;

        // 摄像机参数
        let camX = 0, camY = 0;
        let zoom = 1.0;
        let isLocked = false;
        let isInitialized = false;

        // 手势状态
        let touchIntentTimer = null;
        let lastPinchDist = 0;
        let lastPinchCenter = { x: 0, y: 0 };
        let singleTouchStartPos = { x: 0, y: 0 };
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            
            // 性能与锐度平衡：限制在 1.5\~1.8 倍 DPR，消除卡顿同时确保视网膜级锐度
            dpr = Math.min(window.devicePixelRatio || 1, 1.8);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            // 无论全屏还是非全屏切换，始终自动保持画面居中于视口
            if (!isInitialized) {
                resetCamera();
                isInitialized = true;
            } else {
                camX = width / 2;
                camY = height - 30;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        window.resetCamera = function() {
            camX = width / 2;
            camY = height - 30;
            zoom = 1.0;
        };

        window.toggleLock = function() {
            isLocked = !isLocked;
            if (isLocked) {
                lockBtn.classList.add('active');
                lockBtn.innerText = '[ 已锁定 ]';
                uiMode.innerText = '漫游模式 (单指平移/双指缩放)';
                uiMode.style.color = '#ffaa00';
            } else {
                lockBtn.classList.remove('active');
                lockBtn.innerText = '[ 锁定形态 ]';
                uiMode.innerText = '单指形态变异';
                uiMode.style.color = '#00ffcc';
            }
        };

        function updateTopology(clientX, clientY) {
            normX = Math.min(Math.max(clientX / width, 0.0), 1.0);
            normY = 1.0 - Math.min(Math.max(clientY / height, 0.05), 0.95);
            targetAngle = 0.02 + normX * Math.PI * 0.85; 
            targetScale = 0.48 + normY * 0.28 + normX * 0.04; 
        }

        // 电脑滚轮缩放 (以光标为中心)
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.85 : 1.15;
            const newZoom = Math.max(0.3, Math.min(zoom * zoomFactor, 35.0));
            const actualFactor = newZoom / zoom;
            
            camX = e.clientX - (e.clientX - camX) * actualFactor;
            camY = e.clientY - (e.clientY - camY) * actualFactor;
            zoom = newZoom;
        }, {passive: false});

        // 触控防抖与双指隔离
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                if (touchIntentTimer) {
                    clearTimeout(touchIntentTimer);
                    touchIntentTimer = null;
                }
                lastPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                lastPinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1) {
                singleTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (!isLocked) {
                    touchIntentTimer = setTimeout(() => {
                        updateTopology(singleTouchStartPos.x, singleTouchStartPos.y);
                        touchIntentTimer = null;
                    }, 60);
                }
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            if (e.touches.length === 2) {
                if (touchIntentTimer) {
                    clearTimeout(touchIntentTimer);
                    touchIntentTimer = null;
                }
                const currentCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                
                camX += (currentCenter.x - lastPinchCenter.x);
                camY += (currentCenter.y - lastPinchCenter.y);
                
                const currDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                if (lastPinchDist > 0) {
                    const zoomFactor = currDist / lastPinchDist;
                    const newZoom = Math.max(0.3, Math.min(zoom * zoomFactor, 35.0));
                    const actualFactor = newZoom / zoom;
                    
                    camX = currentCenter.x - (currentCenter.x - camX) * actualFactor;
                    camY = currentCenter.y - (currentCenter.y - camY) * actualFactor;
                    zoom = newZoom;
                }
                
                lastPinchDist = currDist;
                lastPinchCenter = currentCenter;

            } else if (e.touches.length === 1) {
                if (isLocked) {
                    camX += (e.touches[0].clientX - singleTouchStartPos.x);
                    camY += (e.touches[0].clientY - singleTouchStartPos.y);
                    singleTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else {
                    if (!touchIntentTimer) {
                        updateTopology(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', () => {
            if (touchIntentTimer) {
                clearTimeout(touchIntentTimer);
                touchIntentTimer = null;
            }
        });

        // 递归绘制：绝对细线逆补偿算法
        function drawBranch(len, depth) {
            if (depth <= 0) return;

            // 物理像素剔除阈值：小于屏幕物理半像素不画，削减开销
            if (len * zoom * dpr < 0.5) return; 

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            const wind = Math.sin(time + depth * 0.4) * 0.015;
            const hue = depth * 22 + time * 30;

            // 核心修复：线宽必须按全局 zoom 进行严格反向缩减！
            // 确保放大 10 倍后，线条依旧保持 0.5px 的纤细感，绝不变成粗管大白块
            const branchWidth = Math.max((depth * 0.28 + 0.1) / zoom, 0.4 / zoom);
            ctx.lineWidth = branchWidth;

            // 柔和发光透明度，防止多层叠死成白色光团
            ctx.strokeStyle = `hsla(${hue}, 100%, 65%, 0.85)`;

            ctx.save();
            ctx.rotate(curAngle + wind);
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsla(${hue + 90}, 100%, 65%, 0.85)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;

            // 动态控制递归层级，锁死上限防止 CPU 阻塞
            let zoomBonus = Math.floor(Math.max(0, Math.log2(zoom)));
            let currentDepth = Math.floor(9 + normX * 2) + zoomBonus;
            currentDepth = Math.min(currentDepth, 13); // 13级 (8192根线) 是移动端流畅极值

            // 清屏
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            uiZoom.innerText = zoom.toFixed(2) + 'x';
            uiDepth.innerText = Math.pow(2, currentDepth);

            // 摄像机视口变换
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.translate(camX, camY);
            ctx.scale(zoom, zoom);

            // 避免粗糙过曝：使用 round 连接与端点，取消全白覆盖
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const trunkLen = Math.min(height * 0.16, 125);
            ctx.lineWidth = Math.max(2.5 / zoom, 0.8 / zoom);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            drawBranch(trunkLen, currentDepth); 
            ctx.restore();

            time += 0.015;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
