<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System 变异植物</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0a0a0a; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info { 
            position: absolute; 
            bottom: 25px; 
            left: 20px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 12px; 
            line-height: 1.6;
            text-shadow: 0 1px 3px #000;
        }
        .highlight { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM RECURSIVE PLANT<br>
        状态：<span class="highlight">全量程张角 / 解除对称锁</span><br>
        交互：向上拉伸拔高 / 向右拖拽体验极限卷曲
        <br>SPREAD: <span id="ang"></span> | GROWTH: <span id="sca"></span>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        const angDisp = document.getElementById('ang');
        const scaDisp = document.getElementById('sca');
        
        let width = 0, height = 0;
        let mouseX = 0, mouseY = 0;
        let targetAngle = 0.45; 
        let targetScale = 0.65; 
        let curAngle = targetAngle;
        let curScale = targetScale;
        let time = 0;
        let isTouching = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!isTouching) {
                mouseX = width * 0.3;
                mouseY = height * 0.45;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function updateInput(clientX, clientY) {
            isTouching = true;
            mouseX = clientX;
            mouseY = clientY;

            // Y轴：向上滑动拔高生长
            const normY = 1.0 - Math.min(Math.max(mouseY / height, 0.05), 0.95);
            targetScale = 0.45 + normY * 0.32; 

            // 【核心修正】：X轴解除中心对称，改为从左到右的线性映射！
            // 鼠标在最左侧时，树枝闭合 (0.05 rad)；在最右侧时，暴力张开到 144° 极限卷曲！
            const normX = Math.min(Math.max(mouseX / width, 0.0), 1.0);
            targetAngle = 0.05 + normX * Math.PI * 0.8; 
        }

        window.addEventListener('mousemove', e => updateInput(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { 
            updateInput(e.touches[0].clientX, e.touches[0].clientY); 
            e.preventDefault(); 
        }, {passive: false});
        window.addEventListener('touchstart', e => updateInput(e.touches[0].clientX, e.touches[0].clientY), {passive: false});
        window.addEventListener('touchend', () => { isTouching = false; });

        function drawBranch(len, depth) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            if (depth === 0) return;

            const wind = Math.sin(time + depth * 0.8) * 0.03;

            // 右侧分支
            ctx.save();
            ctx.rotate(curAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 28 + time * 30}, 100%, 65%)`;
            ctx.lineWidth = Math.max(depth * 0.7, 0.8);
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            // 左侧分支
            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 28 + time * 30 + 120}, 100%, 65%)`;
            ctx.lineWidth = Math.max(depth * 0.7, 0.8);
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;

            ctx.fillStyle = 'rgba(10, 10, 10, 0.35)';
            ctx.fillRect(0, 0, width, height);

            angDisp.innerText = ((curAngle / Math.PI) * 180).toFixed(1) + '°';
            scaDisp.innerText = curScale.toFixed(2);

            ctx.save();
            ctx.translate(width / 2, height - 20);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            
            const trunkLen = Math.min(height * 0.22, 180);
            
            // 提升递归深度到 10 层，配合暴力张角产生更密集的细节
            drawBranch(trunkLen, 10); 
            ctx.restore();

            time += 0.02;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
