<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 终极空间导航版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #030303; 
            touch-action: none; /* 彻底禁用系统手势 */
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info { 
            position: absolute; 
            bottom: 25px; 
            left: 20px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 11px; 
            line-height: 1.8;
            text-shadow: 0 1px 4px #000;
            z-index: 10;
        }
        .highlight { color: #ff3366; font-weight: bold; }
        .danger { color: #ffaa00; font-weight: bold; }
        
        /* 防走丢归位按钮 */
        #resetBtn {
            position: absolute;
            bottom: 25px;
            right: 20px;
            background: rgba(255, 51, 102, 0.15);
            border: 1px solid #ff3366;
            color: #ff3366;
            padding: 8px 12px;
            font-size: 10px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        #resetBtn:active { background: rgba(255, 51, 102, 0.4); }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // SPATIAL NAVIGATION ENGINE<br>
        单指: 改变基因拓扑 | <span class="highlight">双指/滚轮: 地图级平移与微观缩放</span><br>
        ZOOM: <span id="uiZoom"></span> | DENSITY: <span id="uiDepth"></span>
    </div>
    <button id="resetBtn" onclick="resetCamera()">[ 画面归位 RESET ]</button>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiZoom = document.getElementById('uiZoom');
        const uiDepth = document.getElementById('uiDepth');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        
        // --- 形态基因参数 (带平滑阻尼) ---
        let targetAngle = 0.45; 
        let targetScale = 0.65; 
        let curAngle = targetAngle;
        let curScale = targetScale;
        let normX = 0.3, normY = 0.5;

        // --- 摄像机空间参数 (0延迟绝对跟手) ---
        let camX = width / 2;
        let camY = height - 40;
        let zoom = 1.0;
        
        // 触控手势状态
        let lastPinchDist = 0;
        let lastPinchCenter = { x: 0, y: 0 };
        let time = 0;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 画面归位 (防走丢函数)
        window.resetCamera = function() {
            camX = width / 2;
            camY = height - 40;
            zoom = 1.0;
        };

        // 基因拓扑更新
        function updateTopology(clientX, clientY) {
            normX = Math.min(Math.max(clientX / width, 0.0), 1.0);
            normY = 1.0 - Math.min(Math.max(clientY / height, 0.05), 0.95);
            targetAngle = 0.02 + normX * Math.PI * 0.85; 
            targetScale = 0.48 + normY * 0.28 + normX * 0.04; 
        }

        // ==========================================
        // 核心难点 1：电脑滚轮 - 锚点缩放 (Pivot Scaling)
        // ==========================================
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.85 : 1.15;
            const newZoom = Math.max(0.2, Math.min(zoom * zoomFactor, 30.0)); // 最大放大30倍
            
            // 计算实际的缩放比率
            const actualFactor = newZoom / zoom;
            
            // 将摄像机坐标向鼠标位置靠拢（实现指哪放大哪）
            camX = e.clientX - (e.clientX - camX) * actualFactor;
            camY = e.clientY - (e.clientY - camY) * actualFactor;
            zoom = newZoom;
        }, {passive: false});

        // ==========================================
        // 核心难点 2：手机双指 - 组合平移与缩放 (Pan & Zoom)
        // ==========================================
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // 双指按下：记录初始距离和两指中心点
                lastPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                lastPinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1) {
                updateTopology(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            if (e.touches.length === 2) {
                // 1. 计算新的双指中心点 (用于平移)
                const currentCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                
                // 执行平移 (拖拽)
                camX += (currentCenter.x - lastPinchCenter.x);
                camY += (currentCenter.y - lastPinchCenter.y);
                
                // 2. 计算缩放比率
                const currDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                if (lastPinchDist > 0) {
                    const zoomFactor = currDist / lastPinchDist;
                    const newZoom = Math.max(0.2, Math.min(zoom * zoomFactor, 30.0));
                    const actualFactor = newZoom / zoom;
                    
                    // 以双指中心为锚点执行缩放补偿
                    camX = currentCenter.x - (currentCenter.x - camX) * actualFactor;
                    camY = currentCenter.y - (currentCenter.y - camY) * actualFactor;
                    zoom = newZoom;
                }
                
                // 记录状态供下一帧使用
                lastPinchDist = currDist;
                lastPinchCenter = currentCenter;

            } else if (e.touches.length === 1) {
                updateTopology(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        // 电脑单指操作
        window.addEventListener('mousemove', e => {
            if(e.buttons === 1) updateTopology(e.clientX, e.clientY); 
            else if(e.buttons === 0 && e.clientX && !('ontouchstart' in window)) updateTopology(e.clientX, e.clientY);
        });

        // 递归渲染函数
        function drawBranch(len, depth) {
            if (depth <= 0) return;

            // 性能优化阀门：如果这根树枝在屏幕上已经短于 0.5 像素，放弃渲染
            if (len * zoom < 0.5) return; 

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            const wind = Math.sin(time + depth * 0.4) * 0.015;
            const hue = depth * 22 + time * 30;

            ctx.lineWidth = Math.max(depth * 0.45, 0.3); 

            ctx.save();
            ctx.rotate(curAngle + wind);
            ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsl(${hue + 90}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            // 基因变化保持平滑阻尼，产生生命感
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;

            // LOD: 根据缩放动态计算渲染细节 (7级基础 ~ 极限15级)
            let zoomBonus = Math.floor(Math.max(0, Math.log2(zoom)));
            let currentDepth = Math.floor(10 + normX * 2) + zoomBonus;
            currentDepth = Math.min(currentDepth, 15); // 安全锁止

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(3, 3, 4, 0.6)';
            ctx.fillRect(0, 0, width, height);

            const lineCount = Math.pow(2, currentDepth);
            uiZoom.innerText = zoom.toFixed(2) + 'x';
            uiDepth.innerHTML = lineCount + (lineCount >= 16384 ? ' <span class="danger"> [EXTREME]</span>' : ' LINES');

            // 摄像机矩阵
            ctx.save();
            ctx.translate(camX, camY); // 先平移
            ctx.scale(zoom, zoom);     // 再缩放

            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            
            const trunkLen = Math.min(height * 0.15, 120);
            drawBranch(trunkLen, currentDepth); 
            ctx.restore();

            time += 0.015;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
