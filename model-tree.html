<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 矢量发丝锐度版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #050508; 
            touch-action: none; 
            width: 100vw;
            height: 100vh;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info { 
            position: absolute; 
            top: 15px; 
            left: 15px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 11px; 
            line-height: 1.6;
            text-shadow: 0 1px 3px #000;
            z-index: 10;
        }
        .highlight { color: #ff3366; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // VECTOR INVERSE-SCALE<br>
        状态：<span class="highlight">发丝级微距线宽 / 绝对完整可视</span><br>
        交互：拖拽屏幕改变生长拓扑<br>
        ANGLE: <span id="ang"></span> | SCALE: <span id="sca"></span>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        const angDisp = document.getElementById('ang');
        const scaDisp = document.getElementById('sca');
        
        let width = 0, height = 0, dpr = 1;
        let mouseX = 0, mouseY = 0;
        let time = 0;

        let smoothScale = 1.0;
        let smoothCenterX = 0;
        let smoothCenterY = 0;

        function resize() {
            width = window.innerWidth || document.documentElement.clientWidth || 360;
            height = window.innerHeight || document.documentElement.clientHeight || 640;
            
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            if (mouseX === 0 && mouseY === 0) {
                mouseX = width * 0.4;
                mouseY = height * 0.45;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function setPointer(x, y) {
            mouseX = Math.max(0, Math.min(width, x));
            mouseY = Math.max(0, Math.min(height, y));
        }

        window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { 
            setPointer(e.touches[0].clientX, e.touches[0].clientY); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchstart', e => {
            setPointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        // 包围盒预测计算
        let bMinX = 0, bMaxX = 0, bMinY = 0, bMaxY = 0;

        function computeBounds(x, y, angle, len, depth, branchAngle, branchScale) {
            const x2 = x + Math.sin(angle) * len;
            const y2 = y - Math.cos(angle) * len;

            if (x2 < bMinX) bMinX = x2;
            if (x2 > bMaxX) bMaxX = x2;
            if (y2 < bMinY) bMinY = y2;
            if (y2 > bMaxY) bMaxY = y2;

            if (depth <= 1) return;

            const nextLen = len * branchScale;
            computeBounds(x2, y2, angle + branchAngle, nextLen, depth - 1, branchAngle, branchScale);
            computeBounds(x2, y2, angle - branchAngle, nextLen, depth - 1, branchAngle, branchScale);
        }

        // 递归渲染管线
        function drawBranch(len, depth, branchAngle, branchScale) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            if (depth === 0) return;

            const wind = Math.sin(time + depth * 0.7) * 0.018;

            // 核心修复：线宽逆缩放补偿
            // 确保在屏幕物理尺寸下，末梢细如发丝 (0.5px)，接近根部也仅 1.8px
            const targetScreenPixels = Math.max(0.5, depth * 0.16);
            ctx.lineWidth = targetScreenPixels / smoothScale;

            ctx.save();
            ctx.rotate(branchAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 24 + time * 35}, 100%, 65%)`;
            drawBranch(len * branchScale, depth - 1, branchAngle, branchScale);
            ctx.restore();

            ctx.save();
            ctx.rotate(-branchAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 24 + time * 35 + 120}, 100%, 65%)`;
            drawBranch(len * branchScale, depth - 1, branchAngle, branchScale);
            ctx.restore();
        }

        function render() {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.fillStyle = 'rgba(5, 5, 8, 0.35)';
            ctx.fillRect(0, 0, width, height);

            const branchAngle = (mouseX / width) * (Math.PI * 0.75); 
            const branchScale = 0.42 + (1.0 - mouseY / height) * 0.33;

            angDisp.innerText = ((mouseX / width) * 135).toFixed(1) + '°';
            scaDisp.innerText = branchScale.toFixed(2);

            // 几何边界测量
            const baseTrunk = 100;
            bMinX = 0; bMaxX = 0; bMinY = -baseTrunk; bMaxY = 0;
            computeBounds(0, 0, 0, baseTrunk, 10, branchAngle, branchScale);

            const treeW = Math.max(bMaxX - bMinX, 10);
            const treeH = Math.max(bMaxY - bMinY, 10);
            const centerX = (bMinX + bMaxX) / 2;
            const centerY = (bMinY + bMaxY) / 2;

            // 目标视口缩放比
            const targetFitScale = Math.min((width * 0.82) / treeW, (height * 0.72) / treeH);

            smoothScale += (targetFitScale - smoothScale) * 0.12;
            smoothCenterX += (centerX - smoothCenterX) * 0.12;
            smoothCenterY += (centerY - smoothCenterY) * 0.12;

            ctx.save();
            ctx.translate(width / 2, height * 0.54);
            ctx.scale(smoothScale, smoothScale);
            ctx.translate(-smoothCenterX, -smoothCenterY);

            // 圆角线头，平滑微观接缝
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 主干线宽逆补偿：在屏幕上恒定为 2.2 像素，杜绝实心白块
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2.2 / smoothScale;
            drawBranch(baseTrunk, 11, branchAngle, branchScale);
            ctx.restore();

            time += 0.02;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
