<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 极限微观探索版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #030303; 
            touch-action: none; /* 彻底禁用系统默认手势，把控制权交给 JS */
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info { 
            position: absolute; 
            bottom: 25px; 
            left: 20px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 11px; 
            line-height: 1.8;
            text-shadow: 0 1px 4px #000;
            z-index: 10;
        }
        .highlight { color: #ff3366; font-weight: bold; }
        .danger { color: #ffaa00; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // INFINITE MICROSCOPY ENGINE<br>
        交互：单指改变拓扑 / <span class="highlight">双指或滚轮无极缩放</span><br>
        ZOOM: <span id="uiZoom"></span> | DENSITY: <span id="uiDepth"></span>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiZoom = document.getElementById('uiZoom');
        const uiDepth = document.getElementById('uiDepth');
        
        let width = window.innerWidth;
        let height = window.innerHeight;
        
        // 形态目标参数 (单指控制)
        let targetAngle = 0.45; 
        let targetScale = 0.65; 
        let curAngle = targetAngle;
        let curScale = targetScale;
        let normX = 0.3, normY = 0.5;

        // 无极缩放引擎 (双指/滚轮控制)
        let manualZoom = 1.0;
        let targetManualZoom = 1.0;
        let initialPinchDist = 0;
        let initialZoom = 1.0;
        let camY = 0;
        let time = 0;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
        window.dispatchEvent(new Event('resize'));

        function updateTopology(clientX, clientY) {
            normX = Math.min(Math.max(clientX / width, 0.0), 1.0);
            normY = 1.0 - Math.min(Math.max(clientY / height, 0.05), 0.95);

            targetAngle = 0.02 + normX * Math.PI * 0.85; 
            targetScale = 0.48 + normY * 0.28 + normX * 0.04; 
        }

        // ====== 电脑滚轮缩放 ======
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomDelta = e.deltaY > 0 ? 0.85 : 1.15; // 每次滚动放大/缩小 15%
            targetManualZoom *= zoomDelta;
            // 限制缩放极值 (最小 0.2 倍，最大 20 倍显微镜级别)
            targetManualZoom = Math.max(0.2, Math.min(targetManualZoom, 20.0));
        }, {passive: false});

        // ====== 手机多点触控 ======
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // 双指按下，记录初始距离用于捏合缩放
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = targetManualZoom;
            } else if (e.touches.length === 1) {
                // 单指按下，改变形态
                updateTopology(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => { 
            e.preventDefault(); // 阻止所有默认滚动
            if (e.touches.length === 2) {
                // 双指捏合运算
                const currDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                targetManualZoom = initialZoom * (currDist / initialPinchDist);
                targetManualZoom = Math.max(0.2, Math.min(targetManualZoom, 20.0));
            } else if (e.touches.length === 1) {
                // 单指滑动运算
                updateTopology(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});

        // 电脑鼠标单指控制
        window.addEventListener('mousemove', e => {
            if(e.buttons === 1) updateTopology(e.clientX, e.clientY); // 左键按下时拖动
            else if(e.buttons === 0 && e.clientX && !('ontouchstart' in window)) updateTopology(e.clientX, e.clientY); // 纯鼠标移动
        });

        // 递归渲染核心
        function drawBranch(len, depth) {
            if (depth <= 0) return;

            // 为了性能：在极细微的线段（小于0.5像素）时终止递归，这是防止CPU熔断的安全阀
            if (len * manualZoom < 0.5) return; 

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            const wind = Math.sin(time + depth * 0.4) * 0.015;
            const hue = depth * 22 + time * 30;

            // 利用 lineWidth 与层级的关系，确保末端细如发丝，根部粗壮
            ctx.lineWidth = Math.max(depth * 0.45, 0.3); 

            // 右侧
            ctx.save();
            ctx.rotate(curAngle + wind);
            ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            // 左侧
            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsl(${hue + 90}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            // 平滑阻尼
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;
            manualZoom += (targetManualZoom - manualZoom) * 0.1;
            
            // 动态自动镜头补正
            const targetCamY = height - 30 + (manualZoom > 1 ? (manualZoom - 1) * height * 0.4 : 0);
            camY += (targetCamY - camY) * 0.08;

            // ==========================================
            // 【LOD 细节动态加载逻辑】
            // 基础级别: 11
            // 根据向右张开的程度 (+2)
            // 根据放大的倍数无限制加持 (zoomBonus)
            // ==========================================
            let zoomBonus = Math.floor(Math.max(0, Math.log2(manualZoom)));
            let currentDepth = Math.floor(11 + normX * 2) + zoomBonus;
            
            // 极限性能锁：强行拦截超过 15 级的递归，保护 CPU 不宕机
            // 15 级 = 32768 根独立的渲染线条！
            currentDepth = Math.min(currentDepth, 15);

            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(3, 3, 4, 0.6)';
            ctx.fillRect(0, 0, width, height);

            const lineCount = Math.pow(2, currentDepth);
            uiZoom.innerText = manualZoom.toFixed(2) + 'x';
            uiDepth.innerHTML = lineCount + (lineCount >= 16384 ? ' <span class="danger"> [EXTREME]</span>' : ' LINES');

            ctx.save();
            // 应用缩放和摄像机矩阵
            ctx.translate(width / 2, camY);
            ctx.scale(manualZoom, manualZoom); 
            
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            
            const trunkLen = Math.min(height * 0.15, 120);
            drawBranch(trunkLen, currentDepth); 
            ctx.restore();

            time += 0.015;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
