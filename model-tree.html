<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 极限锐度稳定版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #020202; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        /* 将控制栏调整至安全可视区域 */
        #hud-top {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #00ffcc;
            font-family: monospace;
            font-size: 11px;
            line-height: 1.6;
            pointer-events: none;
            text-shadow: 0 1px 3px #000;
            z-index: 10;
        }
        #hud-bottom {
            position: absolute;
            bottom: 40px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
        }
        button {
            background: rgba(15, 18, 22, 0.85);
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #00ffcc;
            padding: 7px 12px;
            font-size: 11px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        button:active { background: rgba(0, 255, 204, 0.25); }
        button.active {
            border-color: #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.2);
        }
    </style>
</head>
<body>
    <div id="hud-top">
        L-SYSTEM // VECTOR ENGINE<br>
        状态: <span id="uiMode">单指调节形态</span><br>
        ZOOM: <span id="uiZoom">1.00x</span> | BRANCHES: <span id="uiLines">1024</span>
    </div>
    <div id="hud-bottom">
        <button id="lockBtn" onclick="toggleLock()">[ 锁定形态 ]</button>
        <button onclick="resetCamera()">[ 视角复位 ]</button>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiZoom = document.getElementById('uiZoom');
        const uiLines = document.getElementById('uiLines');
        const uiMode = document.getElementById('uiMode');
        const lockBtn = document.getElementById('lockBtn');

        let width = 0, height = 0;

        // 形态参数
        let targetAngle = 0.45;
        let targetScale = 0.65;
        let curAngle = targetAngle;
        let curScale = targetScale;
        let normX = 0.3, normY = 0.5;

        // 摄像机参数
        let camX = 0, camY = 0;
        let zoom = 1.0;
        let isLocked = false;

        // 触控交互状态
        let lastPinchDist = 0;
        let lastPinchCenter = { x: 0, y: 0 };
        let singleTouchPos = { x: 0, y: 0 };
        let touchTimer = null;
        let time = 0;

        // 视角复位函数（函数提升保障）
        function resetCamera() {
            camX = width / 2;
            camY = height - 60;
            zoom = 1.0;
        }

        function toggleLock() {
            isLocked = !isLocked;
            if (isLocked) {
                lockBtn.classList.add('active');
                lockBtn.innerText = '[ 已锁定 ]';
                uiMode.innerText = '漫游视角 (单指拖拽/双指缩放)';
                uiMode.style.color = '#ff3366';
            } else {
                lockBtn.classList.remove('active');
                lockBtn.innerText = '[ 锁定形态 ]';
                uiMode.innerText = '单指调节形态';
                uiMode.style.color = '#00ffcc';
            }
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (camX === 0 && camY === 0) {
                resetCamera();
            } else {
                camX = width / 2;
                camY = height - 60;
            }
        }
        window.addEventListener('resize', resize);

        function updateTopology(clientX, clientY) {
            normX = Math.min(Math.max(clientX / width, 0.0), 1.0);
            normY = 1.0 - Math.min(Math.max(clientY / height, 0.05), 0.95);
            targetAngle = 0.02 + normX * Math.PI * 0.85;
            targetScale = 0.46 + normY * 0.28 + normX * 0.04;
        }

        // 电脑滚轮缩放
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY > 0 ? 0.88 : 1.14;
            const nextZoom = Math.max(0.3, Math.min(zoom * factor, 30.0));
            const ratio = nextZoom / zoom;
            camX = e.clientX - (e.clientX - camX) * ratio;
            camY = e.clientY - (e.clientY - camY) * ratio;
            zoom = nextZoom;
        }, { passive: false });

        // 移动端多指交互隔离
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                if (touchTimer) clearTimeout(touchTimer);
                lastPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                lastPinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1) {
                singleTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (!isLocked) {
                    touchTimer = setTimeout(() => {
                        updateTopology(singleTouchPos.x, singleTouchPos.y);
                    }, 50);
                }
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (e.touches.length === 2) {
                if (touchTimer) clearTimeout(touchTimer);
                const currentCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                camX += (currentCenter.x - lastPinchCenter.x);
                camY += (currentCenter.y - lastPinchCenter.y);

                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );

                if (lastPinchDist > 0) {
                    const factor = currentDist / lastPinchDist;
                    const nextZoom = Math.max(0.3, Math.min(zoom * factor, 30.0));
                    const ratio = nextZoom / zoom;
                    camX = currentCenter.x - (currentCenter.x - camX) * ratio;
                    camY = currentCenter.y - (currentCenter.y - camY) * ratio;
                    zoom = nextZoom;
                }
                lastPinchDist = currentDist;
                lastPinchCenter = currentCenter;
            } else if (e.touches.length === 1) {
                if (isLocked) {
                    camX += (e.touches[0].clientX - singleTouchPos.x);
                    camY += (e.touches[0].clientY - singleTouchPos.y);
                    singleTouchPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else {
                    updateTopology(e.touches[0].clientX, e.touches[0].clientY);
                }
            }
        }, { passive: false });

        window.addEventListener('mousemove', (e) => {
            if (e.buttons === 1) updateTopology(e.clientX, e.clientY);
            else if (e.buttons === 0 && !('ontouchstart' in window)) updateTopology(e.clientX, e.clientY);
        });

        // 递归渲染核心
        function drawBranch(len, depth) {
            if (depth <= 0) return;
            if (len * zoom < 0.4) return; // 视网膜阈值剔除，保障帧率

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            const wind = Math.sin(time + depth * 0.4) * 0.015;
            const hue = depth * 24 + time * 25;

            // 核心修复：线宽随深度减小，并严格除以 zoom 保持发丝级细度，消除大白块
            ctx.lineWidth = Math.max(0.6 / zoom, (len * 0.035));
            ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;

            ctx.save();
            ctx.rotate(curAngle + wind);
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsl(${hue + 90}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;

            const baseDepth = 10;
            const zoomBonus = Math.floor(Math.max(0, Math.log2(zoom)));
            const currentDepth = Math.min(baseDepth + zoomBonus, 12); // 控制在 10\~12 层，维持 60 帧

            // 基础清屏
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.fillStyle = 'rgba(2, 2, 3, 0.4)';
            ctx.fillRect(0, 0, width, height);
            ctx.restore();

            uiZoom.innerText = zoom.toFixed(2) + 'x';
            uiLines.innerText = Math.pow(2, currentDepth);

            // 摄像机视口变换
            ctx.save();
            ctx.translate(camX, camY);
            ctx.scale(zoom, zoom);

            // 核心修复：平角线端（butt），禁用发光重叠导致的死白模糊
            ctx.lineCap = 'butt';
            ctx.lineJoin = 'miter';

            const trunkLen = Math.min(height * 0.16, 120);
            drawBranch(trunkLen, currentDepth);
            ctx.restore();

            time += 0.015;
            requestAnimationFrame(render);
        }

        // 初始化
        resize();
        render();
    </script>
</body>
</html>
