<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System 变异植物</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #0a0a0a; 
            touch-action: none; 
        }
        canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh; 
        }
        /* 置于左上角，彻底杜绝手机底栏遮挡 */
        #info { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 12px; 
            line-height: 1.6;
            text-shadow: 0 1px 3px #000;
        }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // RECURSIVE PLANT<br>
        交互：向上拔高生长 / 向右舒展枝冠<br>
        ANGLE: <span id="ang"></span> | SCALE: <span id="sca"></span>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d');
        const angDisp = document.getElementById('ang');
        const scaDisp = document.getElementById('sca');
        
        let width = 0;
        let height = 0;
        let dpr = 1;
        
        let mouseX = 0;
        let mouseY = 0;
        let time = 0;

        function resize() {
            width = window.innerWidth || document.documentElement.clientWidth || 360;
            height = window.innerHeight || document.documentElement.clientHeight || 640;
            
            // 依据屏幕像素比构建超采样缓冲，消除锯齿与模糊
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            if (mouseX === 0 && mouseY === 0) {
                mouseX = width * 0.45;
                mouseY = height * 0.4;
            }
        }
        window.addEventListener('resize', resize);
        resize();

        function setPointer(x, y) {
            mouseX = Math.max(0, Math.min(width, x));
            mouseY = Math.max(0, Math.min(height, y));
        }

        window.addEventListener('mousemove', e => setPointer(e.clientX, e.clientY));
        window.addEventListener('touchmove', e => { 
            setPointer(e.touches[0].clientX, e.touches[0].clientY); 
            e.preventDefault(); 
        }, { passive: false });
        window.addEventListener('touchstart', e => {
            setPointer(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });

        function drawBranch(len, depth) {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            if (depth === 0) return;

            // X 轴全量程展开（最大约 140 度），向右拖拽充分展开
            const maxAngle = (mouseX / width) * (Math.PI * 0.78); 
            // Y 轴取反：向上划动数值变小，1 - normY 变大，树木拔高
            const branchScale = 0.42 + (1.0 - mouseY / height) * 0.32;
            const wind = Math.sin(time + depth * 0.7) * 0.025;

            // 右侧分支
            ctx.save();
            ctx.rotate(maxAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 24 + time * 35}, 100%, 65%)`;
            ctx.lineWidth = Math.max(depth * 0.65, 0.7);
            drawBranch(len * branchScale, depth - 1);
            ctx.restore();

            // 左侧分支
            ctx.save();
            ctx.rotate(-maxAngle + wind);
            ctx.strokeStyle = `hsl(${depth * 24 + time * 35 + 120}, 100%, 65%)`;
            ctx.lineWidth = Math.max(depth * 0.65, 0.7);
            drawBranch(len * branchScale, depth - 1);
            ctx.restore();
        }

        function render() {
            // 每帧通过 setTransform 保证 DPR 视口绝对对齐，彻底消除黑屏和形变
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            ctx.fillStyle = 'rgba(10, 10, 10, 0.35)';
            ctx.fillRect(0, 0, width, height);

            const deg = ((mouseX / width) * 140).toFixed(1);
            const sca = (0.42 + (1.0 - mouseY / height) * 0.32).toFixed(2);
            angDisp.innerText = deg + '°';
            scaDisp.innerText = sca;

            ctx.save();
            // 树根置于底部居中，留出 25px 底部安全间距
            ctx.translate(width / 2, height - 25);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 8;
            
            // 树干长度按屏幕自适应，递归深度提升至 11 级保证致密性
            const trunkLen = Math.min(height * 0.22, 160);
            drawBranch(trunkLen, 11);
            ctx.restore();

            time += 0.02;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
