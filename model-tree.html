<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>互动 L-System - 视网膜高清与手势隔离版</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            touch-action: none; 
            width: 100vw; 
            height: 100vh; 
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        #info { 
            position: absolute; 
            bottom: 25px; 
            left: 20px; 
            color: #00ffcc; 
            font-family: monospace; 
            pointer-events: none; 
            font-size: 11px; 
            line-height: 1.8;
            text-shadow: 0 1px 4px #000;
            z-index: 10;
        }
        .hud-panel {
            position: absolute;
            bottom: 25px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        button {
            background: rgba(20, 20, 25, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 8px 12px;
            font-size: 10px;
            font-family: monospace;
            border-radius: 4px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        button:active { background: rgba(255, 255, 255, 0.2); }
        button.active {
            border-color: #00ffcc;
            color: #00ffcc;
            background: rgba(0, 255, 204, 0.15);
        }
    </style>
</head>
<body>
    <div id="info">
        L-SYSTEM // RETINA ULTRA-SHARP ENGINE<br>
        模式: <span id="uiMode" style="color:#00ffcc">形态变异中</span><br>
        ZOOM: <span id="uiZoom"></span> | LINES: <span id="uiDepth"></span>
    </div>
    <div class="hud-panel">
        <button id="lockBtn" onclick="toggleLock()">[ 锁定形态 / 纯漫游 ]</button>
        <button onclick="resetCamera()">[ 归位 RESET ]</button>
    </div>
    <canvas id="treeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('treeCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const uiZoom = document.getElementById('uiZoom');
        const uiDepth = document.getElementById('uiDepth');
        const uiMode = document.getElementById('uiMode');
        const lockBtn = document.getElementById('lockBtn');
        
        let width = 0, height = 0;
        let dpr = 1;

        // 形态参数
        let targetAngle = 0.45; 
        let targetScale = 0.65; 
        let curAngle = targetAngle;
        let curScale = targetScale;
        let normX = 0.3, normY = 0.5;

        // 摄像机参数
        let camX = 0, camY = 0;
        let zoom = 1.0;
        let isLocked = false;

        // 触控时序与手势状态
        let touchIntentTimer = null;
        let lastPinchDist = 0;
        let lastPinchCenter = { x: 0, y: 0 };
        let singleTouchStartPos = { x: 0, y: 0 };
        let time = 0;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            // 依据设备像素比构建 2K 超分辨率显存缓冲区
            dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';

            if (camX === 0 && camY === 0) {
                resetCamera();
            }
        }
        window.addEventListener('resize', resize);
        resize();

        window.resetCamera = function() {
            camX = width / 2;
            camY = height - 50;
            zoom = 1.0;
        };

        window.toggleLock = function() {
            isLocked = !isLocked;
            if (isLocked) {
                lockBtn.classList.add('active');
                lockBtn.innerText = '[ 已锁定形态 ]';
                uiMode.innerText = '漫游视角 (单指平移/双指缩放)';
                uiMode.style.color = '#ffaa00';
            } else {
                lockBtn.classList.remove('active');
                lockBtn.innerText = '[ 锁定形态 / 纯漫游 ]';
                uiMode.innerText = '形态变异中 (单指调节)';
                uiMode.style.color = '#00ffcc';
            }
        };

        function updateTopology(clientX, clientY) {
            normX = Math.min(Math.max(clientX / width, 0.0), 1.0);
            normY = 1.0 - Math.min(Math.max(clientY / height, 0.05), 0.95);
            targetAngle = 0.02 + normX * Math.PI * 0.85; 
            targetScale = 0.48 + normY * 0.28 + normX * 0.04; 
        }

        // 电脑滚轮缩放
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY > 0 ? 0.85 : 1.15;
            const newZoom = Math.max(0.2, Math.min(zoom * zoomFactor, 40.0));
            const actualFactor = newZoom / zoom;
            
            camX = e.clientX - (e.clientX - camX) * actualFactor;
            camY = e.clientY - (e.clientY - camY) * actualFactor;
            zoom = newZoom;
        }, {passive: false});

        // 触控时序滤波：解决微秒级触控时差冲突
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                // 第二指落地：立即阻断单指形态更新计时器
                if (touchIntentTimer) {
                    clearTimeout(touchIntentTimer);
                    touchIntentTimer = null;
                }
                lastPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                lastPinchCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
            } else if (e.touches.length === 1) {
                singleTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                
                if (!isLocked) {
                    // 设立 80ms 意图缓冲期，过滤双指落差
                    touchIntentTimer = setTimeout(() => {
                        updateTopology(singleTouchStartPos.x, singleTouchStartPos.y);
                        touchIntentTimer = null;
                    }, 80);
                }
            }
        }, {passive: false});

        window.addEventListener('touchmove', (e) => { 
            e.preventDefault(); 
            if (e.touches.length === 2) {
                if (touchIntentTimer) {
                    clearTimeout(touchIntentTimer);
                    touchIntentTimer = null;
                }
                const currentCenter = {
                    x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                    y: (e.touches[0].clientY + e.touches[1].clientY) / 2
                };
                
                camX += (currentCenter.x - lastPinchCenter.x);
                camY += (currentCenter.y - lastPinchCenter.y);
                
                const currDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                if (lastPinchDist > 0) {
                    const zoomFactor = currDist / lastPinchDist;
                    const newZoom = Math.max(0.2, Math.min(zoom * zoomFactor, 40.0));
                    const actualFactor = newZoom / zoom;
                    
                    camX = currentCenter.x - (currentCenter.x - camX) * actualFactor;
                    camY = currentCenter.y - (currentCenter.y - camY) * actualFactor;
                    zoom = newZoom;
                }
                
                lastPinchDist = currDist;
                lastPinchCenter = currentCenter;

            } else if (e.touches.length === 1) {
                if (isLocked) {
                    // 锁定状态下单指负责全屏平移（Pan）
                    camX += (e.touches[0].clientX - singleTouchStartPos.x);
                    camY += (e.touches[0].clientY - singleTouchStartPos.y);
                    singleTouchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                } else {
                    if (!touchIntentTimer) {
                        updateTopology(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }
            }
        }, {passive: false});

        window.addEventListener('touchend', (e) => {
            if (touchIntentTimer) {
                clearTimeout(touchIntentTimer);
                touchIntentTimer = null;
            }
        });

        // 递归渲染核心
        function drawBranch(len, depth) {
            if (depth <= 0) return;

            // 物理像素剔除：视网膜下极短线条（小于 0.6px）终止递归
            if (len * zoom * dpr < 0.6) return; 

            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -len);
            ctx.stroke();
            ctx.translate(0, -len);

            const wind = Math.sin(time + depth * 0.4) * 0.015;
            const hue = depth * 22 + time * 30;

            // 核心修复：线宽逆补偿，消除缩放造成的粗管模糊感，保持刀锋级矢量锐度
            const sharpLineWidth = Math.max((depth * 0.35 + 0.1) / Math.sqrt(zoom), 0.25);
            ctx.lineWidth = sharpLineWidth;

            ctx.save();
            ctx.rotate(curAngle + wind);
            ctx.strokeStyle = `hsl(${hue}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();

            ctx.save();
            ctx.rotate(-curAngle + wind);
            ctx.strokeStyle = `hsl(${hue + 90}, 100%, 65%)`;
            drawBranch(len * curScale, depth - 1);
            ctx.restore();
        }

        function render() {
            curAngle += (targetAngle - curAngle) * 0.08;
            curScale += (targetScale - curScale) * 0.08;

            let zoomBonus = Math.floor(Math.max(0, Math.log2(zoom)));
            let currentDepth = Math.floor(10 + normX * 2) + zoomBonus;
            currentDepth = Math.min(currentDepth, 15);

            // 清屏
            ctx.save();
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.globalCompositeOperation = 'source-over';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.restore();

            uiZoom.innerText = zoom.toFixed(2) + 'x';
            uiDepth.innerText = Math.pow(2, currentDepth);

            // 摄像机变换：将物理坐标系映射到超采样缓冲区
            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.translate(camX, camY);
            ctx.scale(zoom, zoom);

            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'butt';
            ctx.lineJoin = 'miter';
            ctx.strokeStyle = '#ffffff';
            
            const trunkLen = Math.min(height * 0.15, 120);
            ctx.lineWidth = Math.max(3.0 / Math.sqrt(zoom), 0.8);
            drawBranch(trunkLen, currentDepth); 
            ctx.restore();

            time += 0.015;
            requestAnimationFrame(render);
        }
        render();
    </script>
</body>
</html>
